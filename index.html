<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football: My Passion</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --primary-red: #dc2626;
            --accent-gold: #f59e0b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --neon-glow: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Ambient background glow */
        .glow-bg {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(220, 38, 38, 0.4) 0%, rgba(0,0,0,0) 70%);
            top: 10%;
            left: 10%;
            z-index: -1;
            animation: float 6s ease-in-out infinite alternate;
        }

        .glow-bg-2 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, rgba(0,0,0,0) 70%);
            bottom: 10%;
            right: 10%;
            z-index: -1;
            animation: float 8s ease-in-out infinite alternate-reverse;
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* Main Container */
        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        /* Badge/Tag */
        .tag {
            display: inline-block;
            background: linear-gradient(135deg, var(--primary-red), var(--accent-gold));
            color: white;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 15px;
            background: linear-gradient(to right, #ffffff, #e2e8f0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.lead {
            font-size: 1.25rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .highlight {
            color: var(--accent-gold);
            font-weight: 600;
        }

        /* Highlight box for Liverpool */
        .club-card {
            background: linear-gradient(135deg, rgba(220, 38, 38, 0.15), rgba(0, 0, 0, 0.3));
            border-left: 5px solid var(--primary-red);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: transform 0.3s ease;
        }

        .club-card:hover {
            transform: translateY(-3px);
        }

        .club-card h3 {
            font-size: 1.4rem;
            color: #fff;
        }

        .club-name {
            color: var(--primary-red);
            font-weight: 800;
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.3);
        }

        /* Interactivity Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .stat-box:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--accent-gold);
            transform: scale(1.02);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--accent-gold);
            display: block;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Custom Interactive Button */
        .btn {
            background: linear-gradient(135deg, var(--primary-red), #b91c1c);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.3);
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(220, 38, 38, 0.5);
            background: linear-gradient(135deg, #ef4444, var(--primary-red));
        }

        .btn:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="glow-bg"></div>
    <div class="glow-bg-2"></div>

    <div class="container">
        <span class="tag">Fan Space</span>
        <h1>Football is Life</h1>
        
        <p class="lead">
            Without a doubt, <span class="highlight">Football is my absolute favourite sport</span>. The energy, the tactics, and the beautiful game have captured my heart completely.
        </p>

        <div class="club-card">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary-red);"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <h3>Proud Supporter of <span class="club-name">Liverpool FC</span></h3>
        </div>

        <div class="stats-grid">
            <div class="stat-box" onclick="celebratePitch()">
                <span class="stat-number" id="years-counter">0</span>
                <span class="stat-label">Years Playing</span>
            </div>
            <div class="stat-box" onclick="cheerLiverpool()">
                <span class="stat-number">4</span>
                <span class="stat-label">Starting Age</span>
            </div>
        </div>

        <button class="btn" onclick="kickBall()">⚽ Kick the Ball!</button>
    </div>

    <script>
        // Dynamically calculate years playing based on starting at age 4
        // Example assumes current age calculation or dynamic presentation. 
        // Let's set up an animated counter for the numbers on load.
        function animateCounter(id, target) {
            let current = 0;
            const element = document.getElementById(id);
            const step = Math.ceil(target / 30);
            const timer = setInterval(() => {
                current += step;
                if (current >= target) {
                    element.textContent = target + "+";
                    clearInterval(timer);
                } else {
                    element.textContent = current;
                }
            }, 40);
        }

        // Animate on load (Assuming generic passionate play span, lets dynamically showcase a milestone e.g., 10+ or calculate your custom logic)
        window.onload = function() {
            animateCounter('years-counter', 15); // Adjust this target number to match your exact current duration!
        };

        function kickBall() {
            alert("🎯 GOAL! What a strike into the top corner!");
        }

        function celebratePitch() {
            alert("🏃‍♂️ I've been hitting the pitch and playing since I was just 4 years old!");
        }

        function cheerLiverpool() {
            alert("🔴 You'll Never Walk Alone! Up the Reds!");
        }
    </script>
</body>
</html>
